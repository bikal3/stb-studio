name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /stb-studio
          NEXT_PUBLIC_INSTAGRAM_URL: "https://www.instagram.com/susmitatamangbomjan/"
          NEXT_PUBLIC_FACEBOOK_URL: "https://www.facebook.com/Stbstudio.np"
          NEXT_PUBLIC_TIKTOK_URL: "https://www.tiktok.com/@stbstudi0"
          NEXT_PUBLIC_WHATSAPP_NUMBER: "9779841234567"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
